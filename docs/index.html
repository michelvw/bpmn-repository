<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPMN Repository</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- BPMN libraries -->
<link rel="stylesheet" href="./css/diagram-js.css">
<link rel="stylesheet" href="./css/bpmn-font/css/bpmn-embedded.css">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="./favicon.ico">

<style>
  /* Minimal custom styles */
  #canvas {
    min-height: 70vh;
  }
</style>
</head>

<body class="bg-light">

<!-- ===============================
      AUTH PAGE
================================= -->
<div id="authPage" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <h2 class="mb-4 text-center">Login</h2>
      <div class="mb-3">
        <input id="emailInput" type="email" class="form-control" placeholder="Email">
      </div>
      <div class="mb-3">
        <input id="passwordInput" type="password" class="form-control" placeholder="Password">
      </div>
      <div class="d-flex justify-content-between">
        <button id="btnLogin" class="btn btn-primary w-50 me-2">Login</button>
        <button id="btnSignup" class="btn btn-outline-primary w-50 ms-2">Sign Up</button>
      </div>
    </div>
  </div>
</div>

<!-- ===============================
      OVERVIEW PAGE
================================= -->
<div id="overviewPage" class="container py-4 d-none">

  <div class="d-flex justify-content-between mb-3">
    <div>
      <button id="btnNewOverview" class="btn btn-success me-2">New Diagram</button>
    </div>
    <div>
      <button id="btnProfile" class="btn btn-secondary me-2">Profile</button>
      <button id="btnLogout" class="btn btn-danger">Logout</button>
    </div>
  </div>

  <div class="table-responsive">
    <table id="diagramTable" class="table table-hover table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Last Modified</th>
          <th>Version</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- ===============================
      EDITOR PAGE
================================= -->
<div id="editorPage" class="container py-4 d-none">

  <div class="d-flex align-items-center mb-3">
    <h2 class="me-3 mb-0" id="diagramName">Diagram</h2>
    <button id="btnRename" class="btn btn-outline-secondary btn-sm">Rename</button>
  </div>

  <div id="canvas" class="border bg-white mb-3"></div>

  <div class="mb-3">
    <button id="btnSave" class="btn btn-primary me-1">Save</button>
    <button id="btnBack" class="btn btn-secondary me-1">Back</button>
    <button id="btnShare" class="btn btn-info text-white me-1">Share</button>
    <button id="btnNewInside" class="btn btn-success me-1">New</button>
    <button id="btnDelete" class="btn btn-danger me-1">Delete</button>
    <button id="btnHistory" class="btn btn-outline-secondary">History</button>
  </div>

  <div class="card p-3">
    <p class="mb-1"><strong>Version:</strong> <span id="diagramVersion">-</span></p>
    <p class="mb-1"><strong>Comment:</strong> <span id="diagramComment">-</span></p>
    <p class="mb-1"><strong>Owner:</strong> <span id="diagramOwner">-</span></p>
    <p class="mb-0"><strong>Last Modified:</strong> <span id="diagramDate">-</span></p>
  </div>

</div>

<!-- ===============================
      VERSION HISTORY MODAL
================================= -->
<div id="versionModal" class="modal fade" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Version History</h5>
        <button id="closeVersionModal" type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="versionList"></div>
    </div>
  </div>
</div>

<!-- ===============================
      PROFILE MODAL
================================= -->
<div id="profileModal" class="modal fade" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">User Profile</h5>
        <button id="closeProfileModal" type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="profileUsername" class="form-label">Username</label>
          <input id="profileUsername" type="text" class="form-control">
        </div>
        <div class="d-flex justify-content-end">
          <button id="btnSaveProfile" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===============================
      SCRIPTS
================================= -->
<script src="./bpmn-modeler.production.min.js"></script>
<script type="module" src="./js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
