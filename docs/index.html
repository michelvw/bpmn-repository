<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rijk Zwaan BPMN Editor</title>
  <link rel="stylesheet" href="./css/diagram-js.css">
  <link rel="stylesheet" href="./css/bpmn-font/css/bpmn-embedded.css">
  <style>
    html, body { height: 100%; margin: 0; }
    #canvas { width: 100%; height: 85vh; border: 1px solid #ccc; }
    #controls { height: 15vh; padding: 5px; display: flex; gap: 10px; align-items: center; }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="controls">
  <button id="new">New</button>
  <button id="load">Load</button>
  <button id="save">Save</button>
  <select id="diagramSelector">
    <option value="">Select Diagram</option>
  </select>
  <select id="versionSelector">
    <option value="">Select Version</option>
  </select>
</div>

<script src="./bpmn-modeler.production.min.js"></script>

<script type="module">    
  import { saveDiagram, loadDiagram } from './DiagramService.js';
  import { supabase } from './supabase.js';
  import { v4 as uuidv4 } from 'https://cdn.jsdelivr.net/npm/uuid@9.0.0/dist/esm-browser/index.js';

  const modeler = new window.BpmnJS({
    container: '#canvas'
  });

  const DIAGRAM_ID = 'replace-with-uuid';
  const USER_ID = '78448143-9372-4636-9e2c-32e165b615d6'; // Temporary test user UUID

  // Minimal empty BPMN diagram XML
  const EMPTY_DIAGRAM_XML = `<?xml version="1.0" encoding="UTF-8"?>
  <bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL"
                    xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
                    xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
                    xmlns:di="http://www.omg.org/spec/DD/20100524/DI"
                    id="Definitions_1"
                    targetNamespace="http://bpmn.io/schema/bpmn">
    <bpmn:process id="Process_1" isExecutable="false"/>
    <bpmndi:BPMNDiagram id="BPMNDiagram_1">
      <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1"/>
    </bpmndi:BPMNDiagram>
  </bpmn:definitions>`;

  // --- New Diagram button ---
  document.getElementById('new').onclick = async () => {
    const diagramName = prompt('Enter a name for the new diagram:');

    if (!diagramName) {
      alert('Diagram creation canceled. Name is required.');
      return;
    }

    try {
      await modeler.importXML(EMPTY_DIAGRAM_XML); // Ensure the empty diagram is loaded

      const { data: newDiagram, error } = await supabase
        .from('diagrams')
        .insert({ name: diagramName })
        .select('id')
        .single();

      if (error) {
        throw error;
      }

      const diagramId = newDiagram.id;
      console.log('New diagram created with ID:', diagramId);

      alert('New diagram created! Start modeling and save when ready.');

      // Refresh the diagram selector
      populateDiagramSelector();
    } catch (error) {
      console.error('Error creating new diagram:', error);
      alert('Failed to create the new diagram. Please try again.');
    }
  };

  // --- Load existing version ---
  document.getElementById('load').onclick = async () => {
    const diagramId = document.getElementById('diagramSelector').value;
    const version = document.getElementById('versionSelector').value;

    if (!diagramId || !version) {
      alert('Please select a diagram and version to load.');
      return;
    }

    try {
      const xml = await loadDiagram(diagramId, version);
      await modeler.importXML(xml);
    } catch (error) {
      console.error('Error loading diagram:', error);
      alert('Failed to load the diagram. Please try again.');
    }
  };

  // --- Save current diagram ---
  document.getElementById('save').onclick = async () => {
    const diagramId = document.getElementById('diagramSelector').value;
    const userId = USER_ID; // Replace with actual user ID logic

    if (!diagramId) {
      alert('Please select a diagram to save.');
      return;
    }

    try {
      const { xml } = await modeler.saveXML({ format: true });
      const comment = prompt('Enter a comment for this version:');

      if (!comment) {
        alert('Save operation canceled. Comment is required.');
        return;
      }

      await saveDiagram(diagramId, userId, xml, comment);
      alert('Diagram saved successfully!');
    } catch (error) {
      console.error('Error saving diagram:', error);
      alert('Failed to save the diagram. Please try again.');
    }
  };

  async function populateDiagramSelector() {
    const { data: diagrams } = await supabase.from('diagrams').select('id, name');
    const diagramSelector = document.getElementById('diagramSelector');

    diagrams.forEach(diagram => {
      const option = document.createElement('option');
      option.value = diagram.id;
      option.textContent = diagram.name;
      diagramSelector.appendChild(option);
    });
  }

  document.getElementById('diagramSelector').addEventListener('change', async (event) => {
    const diagramId = event.target.value;
    const { data: versions } = await supabase
      .from('diagram_versions')
      .select('version')
      .eq('diagram_id', diagramId)
      .order('version', { ascending: false });

    const versionSelector = document.getElementById('versionSelector');
    versionSelector.innerHTML = '<option value="">Select Version</option>';

    versions.forEach(version => {
      const option = document.createElement('option');
      option.value = version.version;
      option.textContent = `Version ${version.version}`;
      versionSelector.appendChild(option);
    });
  });

  populateDiagramSelector();
</script>

</body>
</html>
