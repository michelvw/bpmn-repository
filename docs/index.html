<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BPMN Repository</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- BPMN libraries -->
  <link rel="stylesheet" href="./css/diagram-js.css">
  <link rel="stylesheet" href="./css/bpmn-font/css/bpmn-embedded.css">

  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <style>
    body {
      margin: 0;
      background-color: #f8f9fa;
    }

    /* AUTH PAGE */
    #authPage {
      max-width: 400px;
      margin: 3rem auto;
      padding: 2rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    #authPage input {
      margin-bottom: 1rem;
    }

    /* OVERVIEW PAGE */
    #overviewPage {
      padding: 1rem;
    }

    /* EDITOR PAGE */
    #editorPage {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 1rem;
    }

    /* Diagram header with name + rename button */
    #editorPage .diagram-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    #diagramName {
      margin: 0;
      word-break: break-word;
    }

    /* Toolbar */
    .editor-toolbar {
      margin-bottom: 0.5rem;
    }

    /* BPMN canvas */
    #canvas {
      flex: 1;
      border: 1px solid #ccc;
      background-color: white;
    }

    /* Diagram details collapse */
    #diagramDetails .card-body p {
      margin: 0.25rem 0;
    }

    /* Version modal adjustments */
    .version-card {
      margin-bottom: 0.5rem;
    }
  </style>
</head>

<body>
  <!-- AUTH PAGE -->
  <div id="authPage" class="container">
    <h2 class="mb-3">Login</h2>
    <input id="emailInput" type="email" class="form-control" placeholder="Email">
    <input id="passwordInput" type="password" class="form-control" placeholder="Password">
    <div class="mt-3 d-flex gap-2">
      <button id="btnLogin" class="btn btn-primary flex-grow-1">Login</button>
      <button id="btnSignup" class="btn btn-secondary flex-grow-1">Sign Up</button>
    </div>
  </div>

  <!-- OVERVIEW PAGE -->
  <div id="overviewPage" class="container-fluid d-none">
    <div class="d-flex justify-content-between align-items-center my-3">
      <div>
        <div class="btn-group">
          <button type="button" class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown">
            New Diagram
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" id="btnNewOverview"><i class="bi bi-file-earmark me-2"></i>Blank Diagram</a></li>
            <li><a class="dropdown-item" id="btnImportOverview"><i class="bi bi-upload me-2"></i>Import Diagram</a></li>
          </ul>
        </div>
      </div>
      <div>
        <button id="btnProfile" class="btn btn-outline-secondary me-2">
          <i class="bi bi-person-circle"></i> Profile
        </button>
        <button id="btnLogout" class="btn btn-outline-danger">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </div>

    <table id="diagramTable" class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Last Modified</th>
          <th>Version</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- EDITOR PAGE -->
  <!-- EDITOR PAGE -->
<div id="editorPage" class="container-fluid d-none">

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white border-bottom mb-2">
    <div class="container-fluid px-0">

      <!-- Diagram name + rename -->
      <div class="d-flex align-items-center me-3">
        <h6 id="diagramName" class="mb-0 me-2 fw-semibold"></h6>
        <button id="btnRename" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-pencil"></i> Rename
        </button>
      </div>

      <!-- Toolbar actions -->
      <div class="d-flex align-items-center flex-wrap gap-1">

        <!-- New dropdown -->
        <div class="btn-group">
          <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-file-earmark"></i> New
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" id="btnNewInside"><i class="bi bi-file-earmark me-2"></i>Blank Diagram</a></li>
            <li><a class="dropdown-item" id="btnImportInside"><i class="bi bi-upload me-2"></i>Import Diagram</a></li>
          </ul>
        </div>

        <!-- Back / Open -->
        <button id="btnBack" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-folder2-open"></i> Open
        </button>

        <!-- Save -->
        <button id="btnSave" class="btn btn-sm btn-primary">
          <i class="bi bi-floppy"></i> Save
        </button>

        <!-- Share -->
        <button id="btnShare" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-share"></i> Share
        </button>

        <!-- History -->
        <button id="btnHistory" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-clock-history"></i> History
        </button>

        <!-- Download dropdown -->
        <div class="btn-group">
          <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-download"></i> Download
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" id="btnDownloadBpmn"><i class="bi bi-file-earmark-code me-2"></i>BPMN (XML)</a></li>
            <li><a class="dropdown-item" id="btnDownloadSvg"><i class="bi bi-file-earmark-image me-2"></i>SVG</a></li>
            <li><a class="dropdown-item" id="btnDownloadPng"><i class="bi bi-file-earmark-image me-2"></i>PNG</a></li>
          </ul>
        </div>

        <!-- Delete -->
        <button id="btnDelete" class="btn btn-sm btn-outline-danger">
          <i class="bi bi-trash"></i> Delete
        </button>

      </div>
    </div>
  </nav>

  <input id="importFileInput" type="file" accept=".bpmn,.xml" class="d-none">

  <!-- BPMN Canvas -->
  <div id="canvas"></div>

  <!-- Toggle Details Button -->
  <button id="btnToggleDetails" class="btn btn-outline-secondary btn-sm mt-2"
          data-bs-toggle="collapse" data-bs-target="#diagramDetails">
    <i class="bi bi-info-circle"></i> Diagram details
  </button>

  <!-- Collapsible Diagram Details -->
  <div class="collapse mt-2" id="diagramDetails">
    <div class="card card-body">
      <p>Version: <span id="diagramVersion">-</span></p>
      <p>Comment: <span id="diagramComment">-</span></p>
      <p>Owner: <span id="diagramOwner">-</span></p>
      <p>Last Modified: <span id="diagramDate">-</span></p>
    </div>
  </div>
  </div>

  <!-- VERSION MODAL -->
  <div id="versionModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Version History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="versionList"></div>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">User Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="profileUsername" class="form-label">Username</label>
            <input id="profileUsername" type="text" class="form-control">
          </div>
          <button id="btnSaveProfile" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- INPUT MODAL -->
<div id="inputModal" class="modal fade" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="inputModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input id="inputModalField" type="text" class="form-control">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="inputModalConfirm">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- SHARE MODAL -->
<div id="shareModal" class="modal fade" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Share Diagram</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-1">Share this link:</p>
        <div class="input-group">
          <input id="shareLink" type="text" class="form-control" readonly>
          <button class="btn btn-outline-secondary" id="btnCopyLink">Copy</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div id="confirmModal" class="modal fade" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="confirmModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmModalConfirm">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="appToast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

  <!-- Scripts -->
  <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="./bpmn-modeler.production.min.js"></script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
