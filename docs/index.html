<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BPMN Repository</title>
  <link rel="stylesheet" href="./css/diagram-js.css">
  <link rel="stylesheet" href="./css/bpmn-font/css/bpmn-embedded.css">
</head>
<body>

<div id="overviewPage">
  <button id="btnNewOverview">New Diagram</button>
  <table id="diagramTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Last Modified</th>
        <th>Version</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div id="editorPage" style="display:none">

  <h2>
    <span id="diagramName">New Diagram</span>
    <button id="btnRename">Rename</button>
  </h2>

  <div id="canvas" style="height:70vh;border:1px solid #ccc"></div>

  <div>
    <button id="btnSave">Save</button>
    <button id="btnBack">Back</button>
    <button id="btnShare">Share</button>
    <button id="btnNewInside">New</button>
    <button id="btnDelete">Delete</button>
  </div>

  <div id="diagramDetails" style="margin-top:10px;">
    <p>Version: <span id="diagramVersion">-</span></p>
    <p>Comment: <span id="diagramComment">-</span></p>
    <p>Owner: <span id="diagramOwner">-</span></p>
    <p>Last Modified: <span id="diagramDate">-</span></p>
  </div>

</div>

<script src="./bpmn-modeler.production.min.js"></script>
<script type="module" src="./js/app.js"></script>

</body>
</html>
