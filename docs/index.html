<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rijk Zwaan BPMN Editor</title>
  <link rel="stylesheet" href="./css/diagram-js.css">
  <link rel="stylesheet" href="./css/bpmn-font/css/bpmn-embedded.css">
  <style>
    html, body { height: 100%; margin: 0; }
    #canvas { width: 100%; height: 85vh; border: 1px solid #ccc; }
    #controls { height: 15vh; padding: 5px; display: flex; gap: 10px; align-items: center; }
  </style>
</head>

<body>

<div id="initialPage">
  <button id="newDiagram">New Diagram</button>
  <h2>Your Diagrams</h2>
  <table id="diagramOverview">
    <thead>
      <tr>
        <th>Name</th>
        <th>Last Modified</th>
        <th>Latest Version</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Diagrams will be dynamically populated here -->
    </tbody>
  </table>
</div>

<div id="modelerPage" style="display: none;">
  <div id="canvas"></div>
  <div id="modelerControls">
    <button id="saveDiagram">Save Diagram</button>
    <button id="backToOverview">Back to Overview</button>
  </div>
</div>

<script src="./bpmn-modeler.production.min.js"></script>

<script type="module">    
  import { saveDiagram, loadDiagram } from './DiagramService.js';
  import { supabase } from './supabase.js';
  import { v4 as uuidv4 } from 'https://cdn.jsdelivr.net/npm/uuid@9.0.0/dist/esm-browser/index.js';

  const modeler = new window.BpmnJS({
    container: '#canvas'
  });

  const DIAGRAM_ID = 'replace-with-uuid';
  const USER_ID = '78448143-9372-4636-9e2c-32e165b615d6'; // Temporary test user UUID

  // Minimal empty BPMN diagram XML
  const EMPTY_DIAGRAM_XML = `<?xml version="1.0" encoding="UTF-8"?>
  <bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL"
                    xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
                    xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
                    xmlns:di="http://www.omg.org/spec/DD/20100524/DI"
                    id="Definitions_1"
                    targetNamespace="http://bpmn.io/schema/bpmn">
    <bpmn:process id="Process_1" isExecutable="false"/>
    <bpmndi:BPMNDiagram id="BPMNDiagram_1">
      <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1"/>
    </bpmndi:BPMNDiagram>
  </bpmn:definitions>`;

  // --- New Diagram button ---
  document.getElementById('newDiagram').onclick = async () => {
    try {
      await modeler.importXML(EMPTY_DIAGRAM_XML); // Start with an empty canvas
      document.getElementById('initialPage').style.display = 'none';
      document.getElementById('modelerPage').style.display = 'block';
      console.log('Started a new diagram.');
    } catch (error) {
      console.error('Error starting new diagram:', error);
      alert('Failed to start a new diagram. Please try again.');
    }
  };

  // --- Load existing version ---
  document.getElementById('load').onclick = async () => {
    const diagramId = document.getElementById('diagramSelector').value;
    const version = document.getElementById('versionSelector').value;

    if (!diagramId || !version) {
      alert('Please select a diagram and version to load.');
      return;
    }

    try {
      const xml = await loadDiagram(diagramId, version);
      await modeler.importXML(xml);
    } catch (error) {
      console.error('Error loading diagram:', error);
      alert('Failed to load the diagram. Please try again.');
    }
  };

  // --- Save current diagram ---
  document.getElementById('save').onclick = async () => {
    let diagramId = document.getElementById('diagramSelector').value;
    const userId = USER_ID; // Replace with actual user ID logic

    if (!diagramId) {
      const diagramName = prompt('Enter a name for the new diagram:');

      if (!diagramName) {
        alert('Save operation canceled. Name is required.');
        return;
      }

      try {
        const { data: newDiagram, error } = await supabase
          .from('diagrams')
          .insert({ name: diagramName, created_by: userId })
          .select('id')
          .single();

        if (error) {
          throw error;
        }

        diagramId = newDiagram.id;
        console.log('New diagram saved with ID:', diagramId);
      } catch (error) {
        console.error('Error saving new diagram:', error);
        alert('Failed to save the new diagram. Please try again.');
        return;
      }
    }

    try {
      const { xml } = await modeler.saveXML({ format: true });
      const comment = prompt('Enter a comment for this version:');

      if (!comment) {
        alert('Save operation canceled. Comment is required.');
        return;
      }

      await saveDiagram(diagramId, userId, xml, comment);
      alert('Diagram saved successfully!');
    } catch (error) {
      console.error('Error saving diagram:', error);
      alert('Failed to save the diagram. Please try again.');
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    const saveButton = document.getElementById('saveDiagram');
    if (saveButton) {
      saveButton.addEventListener('click', async () => {
        let diagramId = document.getElementById('diagramSelector')?.value;
        const userId = USER_ID; // Replace with actual user ID logic

        if (!diagramId) {
          const diagramName = prompt('Enter a name for the new diagram:');

          if (!diagramName) {
            alert('Save operation canceled. Name is required.');
            return;
          }

          try {
            const { data: newDiagram, error } = await supabase
              .from('diagrams')
              .insert({ name: diagramName, created_by: userId })
              .select('id')
              .single();

            if (error) {
              throw error;
            }

            diagramId = newDiagram.id;
            console.log('New diagram saved with ID:', diagramId);
          } catch (error) {
            console.error('Error saving new diagram:', error);
            alert('Failed to save the new diagram. Please try again.');
            return;
          }
        }

        try {
          const { xml } = await modeler.saveXML({ format: true });
          const comment = prompt('Enter a comment for this version:');

          if (!comment) {
            alert('Save operation canceled. Comment is required.');
            return;
          }

          await saveDiagram(diagramId, userId, xml, comment);
          alert('Diagram saved successfully!');
        } catch (error) {
          console.error('Error saving diagram:', error);
          alert('Failed to save the diagram. Please try again.');
        }
      });
    } else {
      console.error('Save button not found in the DOM.');
    }
  });

  async function populateDiagramSelector() {
    const { data: diagrams, error } = await supabase
      .from('diagrams')
      .select('id, name')
      .eq('created_by', USER_ID); // Filter diagrams by USER_ID

    if (error) {
      console.error('Error fetching diagrams:', error);
      return;
    }

    const diagramSelector = document.getElementById('diagramSelector');
    diagramSelector.innerHTML = ''; // Clear existing options

    diagrams.forEach(diagram => {
      const option = document.createElement('option');
      option.value = diagram.id;
      option.textContent = diagram.name;
      diagramSelector.appendChild(option);
    });
  }

  document.getElementById('diagramSelector').addEventListener('change', async (event) => {
    const diagramId = event.target.value;
    const { data: versions } = await supabase
      .from('diagram_versions')
      .select('version')
      .eq('diagram_id', diagramId)
      .order('version', { ascending: false });

    const versionSelector = document.getElementById('versionSelector');
    versionSelector.innerHTML = '<option value="">Select Version</option>';

    versions.forEach(version => {
      const option = document.createElement('option');
      option.value = version.version;
      option.textContent = `Version ${version.version}`;
      versionSelector.appendChild(option);
    });
  });

  populateDiagramSelector();

  async function loadDiagrams() {
    const { data: diagrams, error } = await supabase
      .from('diagrams')
      .select('id, name, updated_at, diagram_versions(version)')
      .eq('created_by', USER_ID) // Filter diagrams by USER_ID
      .order('updated_at', { ascending: false });

    if (error) {
      console.error('Error loading diagrams:', error);
      return;
    }

    console.log('Loaded diagrams:', diagrams); // Debugging log

    const tbody = document.getElementById('diagramOverview').querySelector('tbody');
    tbody.innerHTML = '';

    diagrams.forEach(diagram => {
      const latestVersion = diagram.diagram_versions[0]?.version || 'N/A';
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${diagram.name}</td>
        <td>${new Date(diagram.updated_at).toLocaleString()}</td>
        <td>${latestVersion}</td>
        <td><button class="openDiagram" data-id="${diagram.id}">Open</button></td>
      `;
      tbody.appendChild(row);
    });

    document.querySelectorAll('.openDiagram').forEach(button => {
      button.addEventListener('click', async (event) => {
        const diagramId = event.target.dataset.id;
        const { data: latestVersion } = await supabase
          .from('diagram_versions')
          .select('bpmn_xml')
          .eq('diagram_id', diagramId)
          .order('version', { ascending: false })
          .limit(1)
          .single();

        if (latestVersion) {
          await modeler.importXML(latestVersion.bpmn_xml);
          document.getElementById('initialPage').style.display = 'none';
          document.getElementById('modelerPage').style.display = 'block';
        }
      });
    });
  }

  document.getElementById('newDiagram').addEventListener('click', () => {
    modeler.importXML(EMPTY_DIAGRAM_XML);
    document.getElementById('initialPage').style.display = 'none';
    document.getElementById('modelerPage').style.display = 'block';
  });

  document.getElementById('backToOverview').addEventListener('click', () => {
    document.getElementById('modelerPage').style.display = 'none';
    document.getElementById('initialPage').style.display = 'block';
  });

  loadDiagrams();
</script>

</body>
</html>
